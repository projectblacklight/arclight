services:
  solr:
    image: "solr:${SOLR_VERSION:-9.10.1}"
    environment:
      - SOLR_MODULES=analysis-extras
    volumes:
      - $PWD/solr/conf:/opt/solr/conf
    ports:
      - 8983:8983
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - blacklight-core
      - /opt/solr/conf
      - "-Xms256m"
      - "-Xmx512m"
